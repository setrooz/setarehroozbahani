<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0709">
  <title>Setareh Roozbahani — Projects</title>
  <link rel="stylesheet" href="projects.css">
</head>
<body>

<a id="name-top" href="index.html">
  Setareh Roozbahani
  <span id="name-sub">Architect &amp; Spatial Explorer</span>
</a>

<div id="controls">
  <div id="menu-wrapper">
    <button class="toggle" id="btn-menu" type="button" aria-expanded="false">MENU</button>
    <div id="menu-dropdown">
      <a href="index.html">HOME</a>
      <a href="research.html">EXPLORATIONS</a>
      <a href="about.html">ABOUT</a>
    </div>
  </div>
</div>

<button id="btn-menu-mobile" type="button" aria-expanded="false">MENU</button>
<div id="menu-dropdown-mobile">
  <a href="index.html">HOME</a>
  <a href="research.html">EXPLORATIONS</a>
  <a href="about.html">ABOUT</a>
</div>

<main id="project-field">
  <canvas id="project-canvas" aria-label="Interactive rotating sphere of projects"></canvas>

  <div id="sphere-status" aria-hidden="true">
    <span id="sphere-status-dot"></span>
    <span id="sphere-status-num">01</span>
  </div>

  <div id="sphere-instruction" class="sphere-copy">
    <span>Drag to explore</span>
    <span>the archive</span>
    <i></i>
  </div>

  <div id="archive-note" class="sphere-copy">
    <span>An archive of</span>
    <span>architectural</span>
    <span>investigations</span>
    <span>across time,</span>
    <span>space, and</span>
    <span>idea.</span>
    <i></i>
  </div>

  <div id="cur"></div>
  <div id="cur-ring"></div>

  <!-- Expanded project preview -->
  <div id="card-overlay" aria-hidden="true">
    <div id="overlay-card">
      <canvas id="overlay-canvas"></canvas>
      <div id="overlay-info">
        <div id="overlay-num"></div>
        <div id="overlay-title"></div>
        <div id="overlay-cat"></div>
        <a id="overlay-link" href="#">VIEW PROJECT →</a>
      </div>
    </div>
    <button id="overlay-close" type="button">✕ CLOSE</button>
  </div>

  <!-- Existing stable grid view -->
  <div id="grid-view" aria-hidden="true">
    <div id="grid-view-inner"></div>
    <button id="grid-close-btn" type="button">✕ BACK TO SPHERE</button>
  </div>

  <button id="show-all-btn" type="button">SHOW GRID</button>

  <!-- Existing project-number strip -->
  <nav id="nav-strip" aria-label="Project navigation"></nav>
</main>

<div id="name-bottom">
  <span id="sig-name">&copy; 2026 Setareh Roozbahani</span>
</div>

<script src="projects.js"></script>
</body>
</html>
