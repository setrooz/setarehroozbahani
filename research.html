<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setareh Roozbahani — Research</title>
  <link rel="stylesheet" href="research.css">
</head>
<body>

<a id="name-top" href="index.html">
  Setareh Roozbahani
  <span id="name-sub">Architect &amp; Spatial Explorer</span>
</a>

<div id="controls">
  <div id="menu-wrapper">
    <button
      class="toggle"
      id="btn-menu"
      type="button"
      aria-expanded="false"
      aria-controls="menu-dropdown"
    >
      MENU
    </button>

    <div id="menu-dropdown">
      <a href="index.html">HOME</a>
      <a href="projects.html">PROJECTS</a>
      <a href="about.html">ABOUT</a>
    </div>
  </div>
</div>

<button
  id="btn-menu-mobile"
  type="button"
  aria-expanded="false"
  aria-controls="menu-dropdown-mobile"
>
  MENU
</button>

<div id="menu-dropdown-mobile">
  <a href="index.html">HOME</a>
  <a href="projects.html">PROJECTS</a>
  <a href="about.html">ABOUT</a>
</div>

<div id="brightness"></div>

<main id="research-field">
  <div id="field-title">
    Explorations — press nodes to explore
  </div>

  <canvas id="edge-canvas" aria-hidden="true"></canvas>

  <section
    id="popup"
    aria-hidden="true"
    aria-labelledby="popup-title"
  >
    <button
      id="popup-close"
      type="button"
      aria-label="Close exploration preview"
    >
      ✕
    </button>

    <canvas
      id="popup-canvas"
      width="220"
      height="120"
      aria-hidden="true"
    ></canvas>

    <div id="popup-num"></div>
    <div id="popup-title"></div>
    <div id="popup-tag"></div>
    <div id="popup-abstract"></div>

    <a id="popup-btn" href="#">
      READ MORE →
    </a>
  </section>

  <section
    id="gallery-view"
    aria-hidden="true"
  >
    <div
      id="gallery-shell"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gallery-title"
    >
      <header id="gallery-header">
        <div id="gallery-heading">
          <div id="gallery-num"></div>
          <div id="gallery-title"></div>
          <div id="gallery-tag"></div>
        </div>

        <button
          id="gallery-close"
          type="button"
        >
          ✕ CLOSE
        </button>
      </header>

      <div id="gallery-stage">
        <div
          id="gallery-track"
          aria-label="Exploration media gallery"
        ></div>

        <button
          id="gallery-prev"
          class="gallery-arrow"
          type="button"
          aria-label="Previous media"
        >
          ←
        </button>

        <button
          id="gallery-next"
          class="gallery-arrow"
          type="button"
          aria-label="Next media"
        >
          →
        </button>
      </div>

      <footer id="gallery-footer">
        <span id="gallery-counter">01 / 01</span>

        <div
          id="gallery-dots"
          aria-label="Gallery navigation"
        ></div>

        <span id="gallery-instruction">
          SWIPE / DRAG HORIZONTALLY
        </span>
      </footer>
    </div>
  </section>

  <div class="axis-label" id="axis-y">METHOD ↑</div>
  <div class="axis-label" id="axis-x">YEAR →</div>
</main>

<div id="name-bottom">
  <span id="sig-name">&copy; 2026 Setareh Roozbahani</span>
</div>

<script src="research.js"></script>
</body>
</html>
